    about:
      about_title: About Me
      about_profile_image: images/icon.jpg
      about_content: |
        Hi, I'm Ivan Zhukov.

        I've spent more than ten years working with data in banking and fintech. I started
        with portfolio analysis and CRM, and gradually moved into building <mark>data products</mark>:
        helping financial platforms decide which offers to show, which external data to use,
        and when it makes sense to contact a customer.

        Today, I <mark>lead a team of five analysts</mark> at IT Finance. Alongside leading the team,
        I work on product logic, write <mark>SQL</mark> and <mark>Python</mark>, and help turn
        analytical ideas and <mark>machine-learning models</mark> into tools that are used in production.

        What I enjoy most is following a problem all the way through: understanding what
        needs to change, working out an approach, and seeing whether it actually helps once
        people start using it. My background in engineering and management makes both the
        technical detail and the business questions interesting to me.

        I am currently working remotely but am open to new opportunities in the United Kingdom or in a remote format.

    content:
      - title: Core Skills
        layout: text
        content: |
          **Products & analytics:** Data products · Analytics leadership · Decisioning & optimisation · Credit scoring · External data & enrichment

          **Programming & Data Processing:** Python, SQL, Pandas, Apache Spark, PySpark, Greenplum, Impala

          **Machine Learning, Ranking & NLP:** CatBoost, LightGBM, XGBoost, DeepFM, multi-armed bandits, predictive modelling, classification, feature engineering, BERT-based NLP, model validation

          **Data Engineering & MLOps:** Airflow, dbt, MLflow, automated data pipelines, ML experiment tracking, model performance monitoring, data quality monitoring

      - title: Experience
        layout: list
        content:
          - layout: left
            border: weak
            title: IT-Finance
            sub_title: Data Analyst Team Lead
            caption_1: Fintech B2B
            caption: June 2024 - Present
            description: |
              <b>A fintech software company building products for banks, consumer lenders
              and financial marketplaces.</b>

              I joined as a data analyst in June 2024 and have led the five-person analytics
              team since February 2025. We work on offer ranking, scoring, external-data
              enrichment and applied machine learning. I help set the direction, work through
              the analytical approach with the team, and coordinate delivery with engineers
              and the people using our products.

              One of my main projects is TakeUp, which decides which lender offers a visitor
              sees on a financial marketplace and in what order. I led its analytical design
              and development, replacing manually configured placements with ranking based
              on commercial performance, credit-risk signals and actual customer outcomes.
              TakeUp improved revenue by 11.1% against the previous ranking logic on comparable
              traffic. Across its wider deployment, estimated additional revenue has averaged
              around £75,000 a month. It is now a core part of the company's WebEngine platform.

              Another project asks a simple question: when is a message worth sending?
              I designed and validated a machine-learning model to avoid low-value
              communications, then coordinated its rollout. Across all business users,
              it saves around £36,000 a month, or about 2% of communication costs, without
              materially reducing valuable customer traffic.

              The team's work also includes detecting bot visits, evaluating external
              scoring models, and developing the Enrichment Service. A recurring part
              of my work is deciding whether a new signal or model adds enough value
              to justify its cost, then helping turn that finding into product logic.

          - layout: left
            border: weak
            title: oneFactor
            sub_title: Lead Data Analyst / Product Manager
            caption_1:  Fintech B2B
            caption: January 2021 - February 2024
            description: |
              <b>A B2B fintech company building scoring, data-enrichment and lead-generation
              products for financial services.</b>

              At oneFactor, I worked on turning external data into useful signals for banks,
              lenders and insurers. A major part of this was a reusable Spark component that
              converted pseudonymised communication events into behavioural features for
              scoring, customer segmentation and lead generation.

              I led the product and analytical side: deciding which events mattered, how to
              classify them, what time windows and thresholds to use, and what the output
              should look like. I worked with data engineers to put that logic into production
              and scale it. This enabled 45 new production pipelines and made the feature
              logic reusable across client projects.

              I also carried out more than 30 client pilots and validation studies. These
              covered questions such as whether we could match enough customers, whether
              a score added useful information, and whether the economics worked in practice.
              I presented the findings to client and commercial teams to help decide what
              to launch or change. I also developed 16 communication scenarios, contributing
              to an approximately 3% improvement in conversion.

              This work supported the expansion of the lead-generation business, whose client
              base grew from 13 to 30 organisations and annual revenue from about £6.5 million
              to £10 million.

