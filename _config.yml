              Developed and tested guidance for the PACL credit decisioning process, expediting client approvals and offers. This collaboration with IT and technology teams accelerated analysis and client batch approvals.
              
              Devised a revenue calculation method based on peak debt load, reducing gross loss risk by 0.4% for clients with low credit scores, considering full and partial loan repayments to enhance risk management strategies.
              
              Conducted comprehensive research on internal fraud within bank offices, uncovering six suspicious activities and prompting internal audits, leading to strengthened internal control mechanisms and security.
              
              Mentored a group of Data Analyst interns, training them in SQL, risk analysis, and core business processes.

