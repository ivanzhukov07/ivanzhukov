            caption: Январь 2021 - Февраль 2024
            description: |
              <b>B2B-финтех-компания, которая создаёт продукты для скоринга, обогащения
              данных и лидогенерации в финансовом секторе.</b>

              В oneFactor я занимался тем, как превратить внешние данные в полезные
              сигналы для банков, кредитных и страховых компаний. Значительная часть
              этой работы — переиспользуемый компонент на Spark, который преобразовывал
              псевдонимизированные коммуникационные события в поведенческие признаки
              для скоринга, сегментации и лидогенерации.

              Я отвечал за продуктовую и аналитическую логику: какие события учитывать,
              как их классифицировать, какие временные окна и пороги использовать,
              что должно получиться на выходе. Вместе с дата-инженерами мы внедрили
              эту логику в продакшен и масштабировали её. Это позволило запустить
              45 новых пайплайнов в продакшене и использовать общую логику
              формирования признаков в разных клиентских проектах.

              Я также провёл больше 30 клиентских пилотов и исследований: проверял охват
              и сопоставление клиентов, полезность скорингов, качество лидов и экономику.
              Обсуждал результаты с клиентами и коммерческой командой, чтобы решить,
