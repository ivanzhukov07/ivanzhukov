      - title: Опыт работы
        layout: list
        content:
          - layout: left
            border: weak
            title: IT-Finance
            sub_title: Data Analyst Team Lead
            caption_1: Финтех B2B
            caption: Июнь 2024 - по н.в.
            description: |
              <b>Финтех-компания, которая разрабатывает программные продукты для банков,
              кредитных организаций и финансовых маркетплейсов.</b>

              Пришёл в компанию аналитиком в июне 2024 года, а с февраля 2025-го руковожу 
              командой из пяти аналитиков. Мы занимаемся ранжированием предложений, скорингом, 
              обогащением данных и прикладным машинным обучением. Я определяю приоритеты, 
              вместе с командой выбираю решения и координирую их внедрение с разработчиками 
              и бизнес-пользователями.

              Один из моих основных проектов — TakeUp. Он определяет, какие предложения
              кредиторов увидит посетитель финансового маркетплейса и в каком порядке.
              Я отвечал за аналитическую разработку и развитие продукта: вместо ручной
              расстановки предложений мы стали учитывать их доходность, кредитный риск
              и реальные результаты взаимодействия с клиентами. TakeUp дал прирост выручки
              на 11,1% относительно прежней логики на сопоставимом трафике.
              При более широком использовании продукта оценочная дополнительная выручка
              составила в среднем около £75 тыс. в месяц. Сейчас TakeUp — один из ключевых
              компонентов платформы WebEngine.

              Другой проект отвечает на простой вопрос: когда сообщение стоит отправлять?
              Я разработал и проверил модель машинного обучения, которая позволяет
              отказываться от малоэффективных коммуникаций, и координировал её внедрение.
              По всем бизнес-пользователям она экономит около £36 тыс. в месяц — примерно
              2% расходов на коммуникации — без существенного сокращения ценного
              клиентского трафика.

              В команде мы также выявляем ботов по поведению на сайтах, оцениваем внешние
              скоринговые модели и развиваем Enrichment Service. Мне часто нужно разобраться,
              даёт ли новый сигнал или модель достаточно пользы с учётом своей стоимости,
              а затем помочь перенести этот вывод в логику продукта.

